<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page hors ligne - La Vieille Roue</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #2B3ABF 0%, #61D4E8 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        
        .container {
            max-width: 600px;
        }
        
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.9;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            font-weight: 800;
        }
        
        p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .button {
            display: inline-block;
            padding: 15px 30px;
            background: #FFB703;
            color: #2B3ABF;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1em;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        
        .logo {
            margin-bottom: 30px;
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .brand-jantes73 {
            background: rgba(255, 255, 255, 0.9);
            color: #2B3ABF;
            padding: 5px 10px;
            border-radius: 5px;
        }
        
        .brand-vieilleroue {
            color: #FFB703;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <span class="brand-jantes73">Jantes 73</span>
            <span style="font-style: italic; margin: 0 5px;">by</span>
            <span class="brand-vieilleroue">La Vieille Roue</span>
        </div>
        
        <div class="icon">📡</div>
        
        <h1>Vous êtes hors ligne</h1>
        
        <p>
            Il semble que vous n'ayez pas de connexion Internet.
            Vérifiez votre connexion et réessayez.
        </p>
        
        <button class="button" onclick="window.location.reload()">
            Réessayer
        </button>
        
        <p style="margin-top: 40px; font-size: 0.9em; opacity: 0.7;">
            📞 Vous pouvez nous contacter au <strong>04 79 32 60 63</strong>
        </p>
    </div>
    
    <script>
        // Auto-reload quand la connexion revient
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
